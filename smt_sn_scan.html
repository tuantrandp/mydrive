<style>
    /* Thu nhỏ chiều cao dòng */
    #smt_sn_scan_data_table_material td,
    #smt_sn_scan_data_table_material th {
        padding: 2px 4px;   /* Giảm padding */
        line-height: 1.2;   /* Giảm line height */
        font-size: 12px;    /* Tùy chọn: thu nhỏ chữ để hiển thị nhiều dòng hơn */
    }

    /* Tùy chọn: nếu bạn muốn bảng hiển thị dày đặc hơn nữa */
    .table {
        margin-bottom: 0;
    }

    /* Tùy chọn: Giảm khoảng cách xung quanh bảng */
    .card-body {
        padding: 8px;
    }

    /* Tùy chọn: nếu bảng cuộn, đặt chiều cao cụ thể */
    .scrollable-table {
        max-height: 1000px;  /* hoặc cao hơn nếu màn hình bạn rộng */
        overflow-y: auto;
    }
</style>


<div id="main-content"><div class="col-md">
    <div class="panel panel-success">
        <table class="table table-bordered table-striped table-lg">
            <tbody><tr class="border-double active">
                <th colspan="6" style="font-size: 20px">
                    <i class="icon-paragraph-justify3" style="font-size: 19px; margin-right: 4px;"></i>
                    SN Scan ( Line: <label id="smt_sn_scan_txt_line"></label> - Station: <label id="smt_sn_scan_txt_station"></label> )

                    <button type="button" id="smt_sn_scan_btn_config_line" class="btn btn-primary" data-target="#smt_sn_scan_config_line_modal" data-toggle="modal" style="margin-left: 10px;">
                        <i class="icon-pencil7" style="padding-right: 4px;"></i>
                        Config line
                    </button>
                </th>
            </tr>
            <tr class="border-double active">
                <td colspan="6">
                    <form class="form-horizontal" action="#">
                        <fieldset>
                            <div class="form-group">
                                <label class="control-label col-lg-1 text-bold">WO:</label>
                                <div class="col-lg-5">
                                    <input id="smt_sn_scan_wo" type="text" class="form-control">
                                </div>

                                <label class="control-label col-lg-1 text-bold">DATA SCAN:</label>
                                <div class="col-lg-5">
                                    <input id="smt_sn_scan_data_scan" type="text" class="form-control">
                                </div>
                            </div>

                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="control-label col-lg-1 text-bold">MESSAGE:</label>
                                <div class="col-lg-5">
                                    <textarea id="smt_sn_scan_message" readonly rows="1" cols="5" class="form-control text-bold"></textarea>
                                </div>
                            </div>
                        </fieldset>
                    </form>

                    <div class="row" style="margin-top: 20px;">
                        <div class="card">
                            <div class="card-body scrollable-table">
                                <table class="table table-bordered table-striped" id="smt_sn_scan_data_table_material"></table>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="smt_sn_scan_config_line_modal" class="modal fade" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h5 class="modal-title">CONFIG LINE</h5>
			</div>

			<div class="modal-body">
				<form class="form-horizontal">
					<div class="form-group">
						<label class="text-semibold control-label col-sm-3">LINE:</label>
						<div class="col-sm-9">
                            <select id="smt_sn_scan_line" class="form-control">
                                <option value=""></option>
                            </select>
						</div>
					</div>

					<div class="form-group">
						<label class="text-semibold control-label col-sm-3">STATION:</label>
						<div class="col-sm-9">
                            <select id="smt_sn_scan_station" class="form-control">
                                <option value=""></option>
                            </select>
						</div>
					</div>
				</form>
			</div>

			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">CANCEL</button>
				<button id="smt_sn_scan_btn_confirm" type="button" class="btn btn-primary" style="margin-left: 20px;">CONFIRM</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript" src="ht_cbd/allparts/smt_process/smt_sn_scan.js"></script>
